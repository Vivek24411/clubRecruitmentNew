# Discovr on the shared E-Cell server.
#
#   cd /home/ubuntu/discovr
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#
# Both services share one image. The split mirrors the old Render setup: the API
# serves HTTP, the worker drains the Mongo-backed job queue (reminder emails +
# push). backend/.env must set RUN_JOBS_IN_API=false so the queue is drained in
# exactly one place.
#
# NOTE ON SECRETS — do not "simplify" this back to env_file:
# Compose interpolates $VAR inside env_file values. A bcrypt hash like
# $2b$12$ANze5... loses everything after the last $, so ADMIN_PASSWORD_HASH
# arrived as 6 characters and every admin login failed. Mounting the file and
# letting the app's own dotenv.config() parse it avoids interpolation entirely.
# The mount is read-only; the container runs as uid 1000, matching the file's
# owner on the host.
name: discovr

x-backend: &backend
  build:
    context: ../..
    dockerfile: deploy/docker/backend.Dockerfile
  image: discovr-backend:latest
  restart: unless-stopped
  volumes:
    - ../../backend/.env:/app/.env:ro
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  api:
    <<: *backend
    container_name: discovr-api
    ports:
      # Loopback ONLY. Docker writes its own iptables rules that bypass ufw, so
      # 0.0.0.0 here would publish the API to the internet regardless of the
      # host firewall. nginx is the only public entrance.
      - "127.0.0.1:3001:3001"

  worker:
    <<: *backend
    container_name: discovr-worker
    command: ["node", "worker.js"]
    depends_on:
      - api
